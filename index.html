<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Paket Rental</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Modul Paket Rental</h1>

        <form action="proses.php" method="POST">

            <label for="nama_paket">Nama Paket</label>
            <input type="text" id="nama_paket" name="nama_paket" placeholder="Contoh: Paket Weekend Hemat" required>

            <label for="jenis_paket">Jenis Paket</label>
            <select id="jenis_paket" name="jenis_paket" required>
                <option value="Lepas Kunci">Lepas Kunci</option>
                <option value="All-in">All-in</option>
                <option value="Luar Kota">Luar Kota</option>
            </select>

            <label for="durasi">Durasi Sewa (Hari)</label>
            <input type="number" id="durasi" name="durasi" placeholder="Contoh: 1" min="1" required>

            <label for="harga">Harga (Rp)</label>
            <input type="number" id="harga" name="harga" placeholder="Contoh: 350000" min="0" required>

            <label for="ketentuan">Ketentuan</label>
            <textarea id="ketentuan" name="ketentuan" placeholder="Masukkan ketentuan paket..."></textarea>

            <button type="submit">Simpan Paket</button>

        </form>

        <br>

        <a href="read.php" class="tambah">Lihat Data Paket</a>

    </div>

</body>
</html>
